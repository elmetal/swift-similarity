name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (Ubuntu)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swift-6.1-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-6.1-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      # Scan this package with its own command plugin. Similar declarations are annotated on the
      # pull request; mark intentional ones with `// similarity-ignore: <reason>`.
      - name: Check for similar code
        run: swift package similarity --format github
